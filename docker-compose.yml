networks:
  app-tier:
    driver: bridge
services:
  app:
    build:
        context: ./so_app/
        dockerfile: Dockerfile.local
    platform: linux/amd64
    env_file:
      - .env
    hostname: so_app
    container_name: so_app
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/swinney/so-app:202509062209"
    networks:
      - app-tier
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWD}
      - DB_NAME=${DB_NAME}
    ports:
      - '80:80'
      - '443:443'
    restart: always
    volumes:
      - ./so_app/src:/app

  mysqldb:
    hostname: so_mysql
    container_name: so_mysql
    image: mysql:latest
    restart: always
    networks:
      - app-tier
    env_file:
      - ".env"
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWD}
    ports:
      - "3306:3306"
    volumes:
      - "./data/db/mysql:/var/lib/mysql"
      - "./so_mysql/src/data.sql:/docker-entrypoint-initdb.d/data.sql"
