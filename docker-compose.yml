networks:
    swinney:
        driver: bridge

volumes:
    mysql_data:

services:
    nginx:
        image: nginx:1.27-alpine
        container_name: so_nginx
        depends_on:
            phpfpm:
                condition: service_started
        networks:
            - swinney
        ports:
            - "80:80"
        volumes:
            - .:/app:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    phpfpm:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: so_phpfpm
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - swinney
        environment:
            XDEBUG_MODE: "${XDEBUG_MODE:-off}"
        volumes:
            - .:/app
            - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        working_dir: /app

    mysql:
        image: mysql:8.4
        container_name: so_mysql
        restart: unless-stopped
        networks:
            - swinney
        environment:
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/dev.cnf:/etc/mysql/conf.d/dev.cnf:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s

    mailpit:
        image: axllent/mailpit:latest
        container_name: so_mailpit
        networks:
            - swinney
        ports:
            - "8025:8025"
            - "1025:1025"
